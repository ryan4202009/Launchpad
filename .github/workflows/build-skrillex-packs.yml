name: Build Skrillex Launchpad Packs

on:
  push:
    branches: [master]
    paths:
      - 'Skrillex - Bangarang.zip'
      - '.github/workflows/build-skrillex-packs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-packs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install audio tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build Bangarang from the real Launchpad project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bangarang /tmp/bangarang_pack
          mkdir -p /tmp/bangarang /tmp/bangarang_pack/sounds/chain1 /tmp/bangarang_pack/sounds/chain2 /tmp/bangarang_pack/sounds/chain3 /tmp/bangarang_pack/sounds/chain4

          unzip -q "Skrillex - Bangarang.zip" -d /tmp/bangarang
          sample_root="/tmp/bangarang/Skrillex - Bangarang/Samples"

          mapfile -t samples < <(find "$sample_root" -maxdepth 1 -type f -iname '*.wav' -printf '%f\n' | sort -V)
          sample_count="${#samples[@]}"

          if [ "$sample_count" -eq 0 ]; then
            echo "No WAV samples found."
            exit 1
          fi

          echo "Found $sample_count real Bangarang WAV samples."

          for slot in $(seq 1 192); do
            idx=$(( (slot - 1) % sample_count ))
            src="$sample_root/${samples[$idx]}"

            chain=$(( (slot - 1) / 48 + 1 ))
            pad=$(( (slot - 1) % 48 + 1 ))
            dst="/tmp/bangarang_pack/sounds/chain${chain}/c${pad}.mp3"

            ffmpeg -hide_banner -loglevel error -y -i "$src" \
              -vn -ac 2 -ar 44100 -codec:a libmp3lame -b:a 128k "$dst"
          done

          rm -f public/zip/sounds/bangarang.zip
          (cd /tmp/bangarang_pack && zip -qr "$GITHUB_WORKSPACE/public/zip/sounds/bangarang.zip" sounds)

      - name: Commit generated pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/zip/sounds/bangarang.zip
          if git diff --cached --quiet; then
            echo "No generated pack changes."
            exit 0
          fi
          git commit -m "Build 192-pad Bangarang sample pack"
          git push
