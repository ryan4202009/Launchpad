name: Build Skrillex Launchpad Packs

on:
  push:
    branches: [master]
    paths:
      - 'public/zip/sounds/*.mp3'
      - 'Skrillex - Bangarang.zip'
      - '.github/workflows/build-skrillex-packs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-packs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install audio tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build Bangarang from the real Launchpad project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bangarang /tmp/bangarang_pack
          mkdir -p /tmp/bangarang /tmp/bangarang_pack/sounds/chain1 /tmp/bangarang_pack/sounds/chain2 /tmp/bangarang_pack/sounds/chain3 /tmp/bangarang_pack/sounds/chain4

          unzip -q "Skrillex - Bangarang.zip" -d /tmp/bangarang
          sample_root="/tmp/bangarang/Skrillex - Bangarang/Samples"

          groups=(a b c d)
          chain=1
          for group in "${groups[@]}"; do
            for i in $(seq 1 12); do
              src="$sample_root/${group}${i}.wav"
              n=$(( (chain-1)*12 + i ))
              dst="/tmp/bangarang_pack/sounds/chain${chain}/c${n}.mp3"

              if [ ! -f "$src" ]; then
                echo "Missing sample: $src"
                exit 1
              fi

              ffmpeg -hide_banner -loglevel error -y -i "$src" \
                -vn -ac 2 -ar 44100 -codec:a libmp3lame -b:a 128k "$dst"
            done
            chain=$((chain+1))
          done

          rm -f public/zip/sounds/bangarang.zip
          (cd /tmp/bangarang_pack && zip -qr "$GITHUB_WORKSPACE/public/zip/sounds/bangarang.zip" sounds)

      - name: Build Scary Monsters from the supplied audio
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/scary_pack
          mkdir -p /tmp/scary_pack

          duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "public/zip/sounds/Skrillex - Scary Monsters And Nice Sprites (Official Audio).mp3")
          clip_duration=$(awk -v d="$duration" 'BEGIN { printf "%.6f", d/48 }')

          for n in $(seq 1 48); do
            start=$(awk -v n="$n" -v d="$clip_duration" 'BEGIN { printf "%.6f", (n-1)*d }')
            chain=$(( (n-1)/12 + 1 ))
            mkdir -p "/tmp/scary_pack/sounds/chain${chain}"
            ffmpeg -hide_banner -loglevel error -y \
              -ss "$start" -i "public/zip/sounds/Skrillex - Scary Monsters And Nice Sprites (Official Audio).mp3" \
              -t "$clip_duration" -vn -ac 2 -ar 44100 -codec:a libmp3lame -b:a 128k \
              "/tmp/scary_pack/sounds/chain${chain}/c${n}.mp3"
          done

          rm -f public/zip/sounds/scary_monsters.zip
          (cd /tmp/scary_pack && zip -qr "$GITHUB_WORKSPACE/public/zip/sounds/scary_monsters.zip" sounds)

      - name: Commit generated packs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/zip/sounds/bangarang.zip public/zip/sounds/scary_monsters.zip
          if git diff --cached --quiet; then
            echo "No generated pack changes."
            exit 0
          fi
          git commit -m "Use real Bangarang Launchpad samples"
          git push
