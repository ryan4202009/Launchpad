# Development and test remain local SQLite databases.
default: &default
  pool: 5
  timeout: 5000

development:
  <<: *default
  adapter: sqlite3
  database: db/development.sqlite3

test:
  <<: *default
  adapter: sqlite3
  database: db/test.sqlite3

# Production uses the PostgreSQL connection supplied in DATABASE_URL.
# Set DATABASE_URL to the pooled Neon connection string in the hosting
# provider's secret/environment-variable settings. Never commit it here.
production:
  <<: *default
  adapter: postgresql
  encoding: unicode
